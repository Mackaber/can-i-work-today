name: Update Homebrew cask

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  update-cask:
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Download macOS release and calculate checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "Release tag must be a version prefixed with v: $GITHUB_REF_NAME" >&2
            exit 1
          fi

          asset="Can.I.Work.Today_${version}_aarch64.dmg"
          mkdir -p "$RUNNER_TEMP/cask-assets"
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$asset" \
            --dir "$RUNNER_TEMP/cask-assets"
          sha256="$(sha256sum "$RUNNER_TEMP/cask-assets/$asset" | cut -d ' ' -f 1)"

          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "SHA256=$sha256" >> "$GITHUB_ENV"

      - name: Update cask version and checksum
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("Casks/can-i-work-today.rb")
          content = path.read_text()
          content, version_count = re.subn(
              r'^  version ".*"$',
              f'  version "{os.environ["VERSION"]}"',
              content,
              count=1,
              flags=re.MULTILINE,
          )
          content, checksum_count = re.subn(
              r'^  sha256 ".*"$',
              f'  sha256 "{os.environ["SHA256"]}"',
              content,
              count=1,
              flags=re.MULTILINE,
          )
          if version_count != 1 or checksum_count != 1:
              raise SystemExit("Expected one version and checksum in the cask")
          path.write_text(content)
          PY

      - name: Commit cask update
        run: |
          if git diff --quiet -- Casks/can-i-work-today.rb; then
            echo "Cask is already up to date"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/can-i-work-today.rb
          git commit -m "Update Homebrew cask to $VERSION"
          git push
